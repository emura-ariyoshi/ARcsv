<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AR CSV" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>AR CSV Viewer</title>
    <script type="module" crossorigin src="./assets/index-CDO1mHqo.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CGFZLE3Y.css">
  </head>
  <body>
    <div id="app">
      <div class="camera-shell">
        <video id="camera" autoplay playsinline muted></video>
        <div id="ar-scene" aria-live="polite"></div>
        <div class="reticle"></div>
      </div>

      <div class="hud">
        <div class="panel top-bar">
          <div>
            <p class="label">X / Y（平面直角座標系 III系）</p>
            <strong id="location-status">待機中</strong>
          </div>
          <div>
            <p class="label">方向</p>
            <strong id="heading-status">0°</strong>
          </div>
          <div>
            <p class="label">QR</p>
            <strong id="qr-status">未読込</strong>
          </div>
        </div>

        <div class="panel controls">
          <button id="start-button" type="button">AR開始</button>
          <label class="upload-button" for="csv-upload">CSV読み込み</label>
          <input id="csv-upload" type="file" accept=".csv,text/csv" />
          <button id="scan-button" type="button" class="secondary">QR読み取り</button>
          <button id="sample-button" type="button" class="secondary">サンプル表示</button>
        </div>

        <div class="panel data-panel">
          <h2>ポイント一覧</h2>
          <ul id="point-list"></ul>
        </div>
      </div>
    </div>

    <script>
      const sourceEntry = document.querySelector('script[src="/src/main.js"]');
      const isGithubPages = window.location.hostname.endsWith('github.io');
      if (sourceEntry && isGithubPages && !window.location.pathname.endsWith('/dist/')) {
        window.location.replace(`${window.location.pathname.replace(/\/$/, '')}/dist/`);
      }
    </script>
  </body>
</html>
